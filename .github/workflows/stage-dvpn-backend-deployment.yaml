name: '[stage] Deploy stage-dvpn-backend'

on: 
  push:
    branches: 
      - stage

jobs:
  dvpn-backend:
    uses: Qubetics/argocd-qubetics/.github/workflows/deployment.yaml@dev
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: stage-dvpn-backend/deployment.yaml
      HUAWEI_IMAGE: stage-dvpn-backend
      DOCKER_USERNAME: ap-southeast-3@HPUAJWWFSLCMD312AZSR
      ENV: ${{ vars.STAGE_DVPN_BACKEND }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_NEW }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY_NEW }}
